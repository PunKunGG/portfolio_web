<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">NexusPlay order tracking preview</title>
  <desc id="description">A preview of the NexusPlay order search and current orders interface.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafbfc" />
      <stop offset="1" stop-color="#f1f3f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#page)" />
  <rect width="1200" height="72" fill="#ffffff" />
  <path d="M0 71.5h1200" stroke="#e5e7eb" />

  <g transform="translate(200 18)">
    <rect width="38" height="38" rx="12" fill="#020617" />
    <g transform="translate(8 7)" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m11 0 11 6v12L11 24 0 18V6L11 0Z" />
      <path d="m0 6 11 6 11-6M11 12v12M5.5 3 17 9.3v8" />
    </g>
    <text x="52" y="25" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">NEXUS</text>
    <text x="117" y="25" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ef233c">PLAY</text>
  </g>

  <g transform="translate(854 27)" font-family="Arial, Helvetica, sans-serif">
    <circle cx="8" cy="8" r="7" fill="none" stroke="#10b981" stroke-width="1.5" />
    <path d="m5 8 2 2 4-5" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="13" font-size="13" fill="#64748b">Secure order tracking</text>
  </g>

  <g transform="translate(250 112)" font-family="Arial, Helvetica, sans-serif">
    <rect width="128" height="28" rx="14" fill="#fff1f2" />
    <circle cx="16" cy="14" r="3" fill="#ef233c" />
    <text x="28" y="19" font-size="12" font-weight="700" letter-spacing="1.1" fill="#be123c">ORDER CENTER</text>

    <text y="78" font-size="42" font-weight="700" fill="#0f172a">Track Your Order</text>
    <text y="112" font-size="17" fill="#64748b">Enter your order number to check the latest status of your order.</text>

    <g transform="translate(0 145)" filter="url(#shadow)">
      <rect width="700" height="124" rx="18" fill="#ffffff" stroke="#e2e8f0" />
      <text x="24" y="31" font-size="14" font-weight="600" fill="#334155">Order Number</text>
      <rect x="24" y="45" width="505" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1" />
      <circle cx="48" cy="69" r="7" fill="none" stroke="#94a3b8" stroke-width="2" />
      <path d="m53 74 6 6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <text x="72" y="75" font-size="14" fill="#64748b">ORD-2587965432159-458</text>
      <rect x="541" y="45" width="135" height="48" rx="9" fill="#ef233c" />
      <text x="565" y="75" font-size="14" font-weight="700" fill="#ffffff">Track Order</text>
      <path d="m654 64 6 5-6 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="24" y="112" font-size="11" fill="#64748b">Example: ORD-2587965432159-458</text>
    </g>

    <text y="315" font-size="11" font-weight="700" letter-spacing="1.8" fill="#64748b">YOUR PURCHASES</text>
    <text y="347" font-size="22" font-weight="700" fill="#0f172a">Orders</text>
    <text x="650" y="347" font-size="13" text-anchor="end" fill="#64748b">3 orders</text>

    <g transform="translate(0 367)">
      <text x="14" y="22" font-size="14" fill="#0f172a">Current Orders</text>
      <text x="112" y="22" font-size="12" font-weight="700" fill="#ef233c">3</text>
      <text x="380" y="22" font-size="14" fill="#64748b">Order History</text>
      <text x="480" y="22" font-size="12" font-weight="700" fill="#64748b">2</text>
      <path d="M0 42h700" stroke="#e2e8f0" stroke-width="2" />
      <path d="M0 42h350" stroke="#ef233c" stroke-width="2" />
    </g>

    <g transform="translate(0 425)" filter="url(#shadow)">
      <rect width="700" height="104" rx="16" fill="#ffffff" stroke="#e2e8f0" />
      <rect x="20" y="26" width="48" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
      <path d="m44 36 10 5.5v11L44 58l-10-5.5v-11L44 36Z" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round" />
      <path d="m34 41.5 10 5.5 10-5.5M44 47v11" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round" />
      <text x="84" y="33" font-size="10" font-weight="700" letter-spacing="1.3" fill="#64748b">ORDER ID</text>
      <text x="84" y="57" font-size="16" font-weight="700" fill="#0f172a">ORD-2587965432159-458</text>
      <text x="84" y="79" font-size="11" fill="#64748b">21/08/2026 15:42</text>
      <rect x="564" y="23" width="112" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe" />
      <circle cx="581" cy="37" r="6" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="11 5" />
      <text x="593" y="41" font-size="11" font-weight="600" fill="#2563eb">In Progress</text>
      <text x="676" y="72" font-size="11" text-anchor="end" fill="#64748b">Your order is being prepared</text>
    </g>
  </g>
</svg>
